[project]
name = "multimodal-embeddings-api"
version = "0.1.0"
description = "FastAPI service that generates text (and later image) embeddings with CLIP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sentence-transformers>=3.3",
    # Required by CLIP's image processor, even for text-only use.
    "pillow>=11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx2>=2.16",  # HTTP client used by FastAPI's TestClient
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "N",       # pep8 naming
    "D",       # docstrings
    "ANN",     # type annotations
    "UP",      # modern Python syntax
    "B",       # likely bugs
    "SIM",     # simplifications
    "RUF",     # ruff-specific
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
